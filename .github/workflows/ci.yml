name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      # OpenAPI から生成した型を手で直していないか（写した openapi.json から作り直して比べる）
      - name: Check generated API types
        run: |
          pnpm --filter @sendo-reader/core api:generate
          if [ -n "$(git status --porcelain -- packages/core/src/api)" ]; then
            git status --porcelain -- packages/core/src/api
            echo "::error::packages/core/src/api/schema.gen.ts が openapi.json と合っていない。pnpm --filter @sendo-reader/core api:generate を実行してコミットする"
            exit 1
          fi

      # packages/core の Web のテスト（ワーカー、OPFS、タブの間のやり取り）は Chromium で動かす
      - name: Install Chromium for browser tests
        run: pnpm --filter @sendo-reader/core exec playwright install --with-deps chromium

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # 画面のスレッドの JS の大きさが予算に収まっているか（docs/decisions/performance.md）
      - name: Size budget
        run: pnpm size
