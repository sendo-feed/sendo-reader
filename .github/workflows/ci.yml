name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # pull_request では、マージコミットとその第1親（マージ先）を比べて、変わったファイルを見る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # PR で変わったのが Markdown だけなら、決定の文書の検査だけを動かし、残りの段は飛ばす。
      # ジョブごと飛ばさないのは、Check をマージに必須の検査にしても、成功として残すため。
      # main への push では、いつもすべてを動かす
      - name: Detect docs-only change
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          files=$(git -c core.quotePath=false diff --name-only HEAD^1 HEAD)
          if grep -qv '\.md$' <<<"$files"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::変わったのは Markdown だけなので、決定の文書の検査だけを動かす"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changes.outputs.docs_only != 'true'

      # pnpm のキャッシュは pnpm がないと使えないので、文書だけのとき（pnpm を入れない）は使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: ${{ steps.changes.outputs.docs_only != 'true' && 'pnpm' || '' }}

      - name: Check decision docs
        run: node scripts/check-decisions.mjs

      - name: Install
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm exec biome ci .

      - name: Typecheck
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm typecheck

      # OpenAPI から生成した型を手で直していないか（写した openapi.json から作り直して比べる）
      - name: Check generated API types
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          pnpm --filter @sendo-reader/core api:generate
          if [ -n "$(git status --porcelain -- packages/core/src/api)" ]; then
            git status --porcelain -- packages/core/src/api
            echo "::error::packages/core/src/api/schema.gen.ts が openapi.json と合っていない。pnpm --filter @sendo-reader/core api:generate を実行してコミットする"
            exit 1
          fi

      # packages/core の Web のテスト（ワーカー、OPFS、タブの間のやり取り）は Chromium で動かす
      - name: Install Chromium for browser tests
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm --filter @sendo-reader/core exec playwright install --with-deps chromium

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm test

      - name: Build
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm build

      # 画面のスレッドの JS と、DB のワーカーの JS・wasm が予算に収まっているか
      # （docs/decisions/performance.md）
      - name: Size budget
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm size

      # 画面を通したテストと、起動から記事が出るまでの時間・操作の反応の関所
      # （docs/decisions/performance.md）
      - name: End-to-end tests
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm e2e

      - name: Upload Playwright results
        if: failure() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results/
          retention-days: 14

      # 初回の読み込み（キャッシュなし）を Lighthouse で測って残す。上限は試作してから決める
      - name: Lighthouse
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm --filter @sendo-reader/web lighthouse

      - name: Upload Lighthouse results
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: apps/web/.lighthouseci/
          retention-days: 14
