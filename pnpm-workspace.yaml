packages:
  - packages/*
  - apps/*

# 公開から 14 日たっていないバージョンは入れない（分単位）。
# 乗っ取られたパッケージは公開後すぐに見つかって取り下げられることが多いので、
# 少し待つだけでサプライチェーン攻撃の多くを避けられる。
minimumReleaseAge: 20160

# インストール時にスクリプトを実行してよい依存だけを許可する。
# esbuild と workerd は、プラットフォームごとのバイナリを用意するために必要（wrangler が使う）。
allowBuilds:
  esbuild: true
  workerd: true
